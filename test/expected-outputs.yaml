# Expected outputs for optimus skill tests.
# Used by scripts/test-skills.sh to validate skill execution results.
#
# Format per skill:
#   <skill-name>:
#     <fixture-name>:
#       files_exist: [list of files that must exist after skill runs]
#       files_contain:
#         <file-path>: [strings that must appear in the file; case-sensitive]
#       files_not_exist: [list of files that must NOT exist]
#       output_contains: [strings in the final response text; case-insensitive]
#       output_nonempty: true  # weak completion-only smoke; not semantic success
#       branch_prefix: "feat/"  # inspect the actual Git branch
#       files_not_modified: true  # assert no files changed (read-only skills)
#
# Paths are relative to the fixture project root.

init:
  node-project: &init-core
    files_exist:
      - .claude/CLAUDE.md
      - .claude/docs/coding-guidelines.md
      - .claude/.optimus-version
    files_contain:
      .claude/docs/coding-guidelines.md:
        - "Coding principles for"
  python-project: *init-core
  go-project: *init-core
  rust-project: *init-core
  csharp-project: *init-core
  monorepo-project: *init-core

  empty-project:
    # Empty project triggers scaffolding prompt — init may or may not create files
    # depending on the host. Require successful completion and a response only;
    # this is not evidence of successful initialization on an empty project.
    output_nonempty: true

permissions:
  node-project:
    files_exist:
      - .claude/hooks/restrict-paths.sh
    files_contain:
      .claude/hooks/restrict-paths.sh:
        - "#!/usr/bin/env bash"

commit-suggest:
  node-project:
    # Read-only mode: suggests a message but changes nothing
    files_not_modified: true

how-to-run:
  node-project:
    files_exist:
      - HOW-TO-RUN.md
    files_contain:
      HOW-TO-RUN.md:
        - "npm install"
        - "Prerequisites"

  python-project:
    files_exist:
      - HOW-TO-RUN.md
    files_contain:
      HOW-TO-RUN.md:
        - "pip install"
        - "Prerequisites"

prompt:
  node-project:
    # Read-only skill: crafts a prompt but changes nothing
    files_not_modified: true

commit-branch:
  node-project:
    # Check actual Git state, not a branch name merely mentioned in prose.
    branch_prefix: "feat/"
