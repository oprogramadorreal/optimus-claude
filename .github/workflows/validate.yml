name: Validate

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements-dev.txt
      - run: bash scripts/validate.sh

  test-hooks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/test-hooks.sh

  test-python:
    # Windows is not decoration here: format-python.sh probes .venv/Scripts
    # before .venv/bin only on Windows, and that whole branch is unreachable on
    # a Linux runner — the bug it guards against could be reintroduced and every
    # ubuntu job would still be green.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest test/ -v
